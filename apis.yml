description: Purolator is a Canadian courier and freight carrier. Its API Portal publishes REST APIs (OAuth bearer
  tokens) for authentication, estimating, locating, pickups, tracking, shipping, documents and manifests, with public
  OpenAPI 3.0 definitions, alongside its legacy E-Ship SOAP web services, whose WSDLs require credentials.
